name: Validate tap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    # Proves the committed formulas and casks are exactly what the generators
    # produce from their pinned releases. A red run here means someone hand-edited
    # a generated file or a pinned release's assets moved.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Every package reproduces byte for byte
        run: bash .github/scripts/verify-renders.sh
      - name: Selection, verification, and add-a-package suites
        run: bash .github/scripts/test/all.sh

